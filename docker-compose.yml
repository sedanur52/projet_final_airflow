services:
  airflow:
    image: ${AIRFLOW_IMAGE}
    container_name: airflow-fx-rates
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./sql:/opt/airflow/sql
      - ./doc:/opt/airflow/doc
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
      PYTHONPATH: /opt/airflow/include
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL}
      FRANKFURTER_BASE_CURRENCY: ${FRANKFURTER_BASE_CURRENCY}
      FRANKFURTER_TARGET_CURRENCIES: ${FRANKFURTER_TARGET_CURRENCIES}
      FX_ALERT_THRESHOLD: ${FX_ALERT_THRESHOLD}
      FX_FRESHNESS_THRESHOLD_DAYS: ${FX_FRESHNESS_THRESHOLD_DAYS}
      FX_FORCE_INVALID_RATE_FOR: ${FX_FORCE_INVALID_RATE_FOR}
      FX_FORCE_INVALID_CODE_FOR: ${FX_FORCE_INVALID_CODE_FOR}
      TASK_RETRIES: ${TASK_RETRIES}
      TASK_RETRY_DELAY_SECONDS: ${TASK_RETRY_DELAY_SECONDS}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS}
      AIRFLOW_POSTGRES_CONN_ID: ${AIRFLOW_POSTGRES_CONN_ID}
      AIRFLOW_CONN_POSTGRES_FX: ${AIRFLOW_CONN_POSTGRES_FX}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || \
        airflow users reset-password \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}"
        exec airflow standalone

  postgres:
    image: postgres:15
    container_name: postgres-fx-rates
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${TARGET_POSTGRES_DB}
      POSTGRES_USER: ${TARGET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-fx-rates
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./metabase-data:/metabase-data
